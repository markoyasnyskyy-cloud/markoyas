<!DOCTYPE html>
<html lang="en">
<head>
    <title>Замовлення піци online</title>
</head>
<body>
    <h2>Замовлення піци online</h2>
    <form action="#" method="POST">

        <p>
            <label>Ваше ім'я:</label><br>
            <input type="text"  placeholder="Введіть ваше ім'я" required>
        </p>

        <p>
            <label>Номер телефону:</label><br>
            <input type="tel" type="text"  placeholder="+380XXXXXXXXX" required>
        </p>

        <p>
            <label>Розмір піци:</label><br>
            <select>
                <option>Маленька(25см)</option>
                <option>Середня(30см)</option>
                <option>Велика(40см)</option>
            </select>
        </p>

        <p>Виберіть соус:<br>
            <input type="radio">
            <label>Томатний</label><br>
            <input type="radio">
            <label>Вершковий</label><br>
            <input type="radio">
            <label>Часникрвий</label>
        </p>
 <p>Додаткові інгредієнти:<br>
            <input type="checkbox">
            <label> Сирний бортик</label><br>
            <input type="checkbox">
            <label> Подвійне м'ясо</label><br>
            <input type="checkbox">
            <label>Гриби</label><br>
            <input type="checkbox">
            <label>Оливкове масло</label>
        </p>
        <p>
            <label>Адреса доставки та побажання до кур'єра:
</label><br>
            <textarea rows="4.5" cols="40"></textarea>
        </p>

        <p>
            <input type="submit" value="Оформити замовлення">
        </p>

    </form>
</body>
</html>
